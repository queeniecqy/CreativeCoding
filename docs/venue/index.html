<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展場實景 360°</title>
<style>
  :root {
    --ink: #f4f2ee; --muted: rgba(244,242,238,.72); --glass: rgba(20,20,22,.58); --line: rgba(255,255,255,.16);
    --accent: #7fc4ad;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: var(--ink); overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas#view.drag { cursor: grabbing; }

  .panel { position: fixed; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border: 1px solid var(--line); border-radius: 14px; }
  .title { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; padding: 14px 18px; max-width: min(420px, calc(100vw - 32px)); }
  .title h1 { margin: 0; font-size: 18px; letter-spacing: .03em; }
  .title p { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

  .bar { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
         width: min(560px, calc(100vw - 32px)); padding: 10px; }
  .strip { position: relative; width: 100%; aspect-ratio: 2613 / 626; border-radius: 8px; overflow: hidden; cursor: pointer; }
  .strip img { width: 100%; height: 100%; display: block; opacity: .85; }
  .strip .vp { position: absolute; top: 0; bottom: 0; border: 2px solid var(--accent); border-radius: 4px;
               box-shadow: 0 0 0 9999px rgba(0,0,0,.28); pointer-events: none; }
  .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .controls button { background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid var(--line);
                     border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--accent); color: #10201b; border-color: var(--accent); }
  .controls .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .controls .hint { display: none; } }

  .gap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 16px; border-radius: 999px;
         background: var(--glass); border: 1px solid var(--line); font-size: 13px; color: var(--muted); pointer-events: none;
         transition: opacity .3s; }
  .flat { position: fixed; inset: 0; background: #111; display: grid; place-items: center; padding: 24px; overflow: auto; }
  .flat img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="gap" id="gap" style="opacity:0">此方向未拍攝</div>

<div class="flat" id="flat" hidden><img id="flatImg" alt="展場全景平面圖"></div>
<div class="err" id="err" hidden>這個瀏覽器不支援 WebGL，請改按「平面全景」查看，或換用 Chrome / Edge / Safari。</div>

<section class="panel title">
  <h1>展場實景 360°</h1>
  <p>Creative Coding VR 展覽的實際場地。拖曳環顧四周、滾輪或雙指縮放，設計作品配置時可以參考牆面、窗戶與柱子的位置。</p>
</section>

<section class="panel bar">
  <div class="strip" id="strip" title="點擊跳到該方向"><img id="stripImg" alt=""><div class="vp" id="vp"></div></div>
  <div class="controls">
    <button type="button" id="btnAuto" aria-pressed="true">自動旋轉</button>
    <button type="button" id="btnReset">重設視角</button>
    <button type="button" id="btnFlat" aria-pressed="false">平面全景</button>
    <button type="button" id="btnFull">全螢幕</button>
    <span class="hint">拖曳：環顧　滾輪：縮放　← →：轉向</span>
  </div>
</section>

const COVERAGE_DEG = +(new URLSearchParams(location.search).get('cov') || 315); // 照片水平涵蓋角度
const HORIZON = 0.5;                       // 地平線在照片中的高度（0 = 頂端）

const $ = id => document.getElementById(id);

    vec3 sampleH(float a, float v) {

    if (auto && now - lastInteract > 2500) { view.yaw += dt * 0.12; dirty = true; }
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); dirty = true; }
    if (!dirty || gl.isContextLost()) { requestAnimationFrame(frame); return; }
    dirty = false;
    clampView();
    gl.uniform2f(U('uRes'), w, h);
    gl.uniform1f(U('uYaw'), view.yaw); gl.uniform1f(U('uPitch'), view.pitch); gl.uniform1f(U('uFov'), view.fov);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    updateStrip(w / h);
    requestAnimationFrame(frame);
  }
}

// 視角與上下轉動都限制在照片拍到的範圍內，避免看到補色
// （畫面角落的光線比中央更斜，所以多留 15% 餘裕）
function clampView() {
  view.fov = Math.min(FOV_MAX, Math.max(FOV_MIN, view.fov));
  const lim = Math.max(0, HALF_V - view.fov * 0.5 * 1.15);
  view.pitch = Math.max(-lim, Math.min(lim, view.pitch));
}

// 下方縮圖上的取景框
function updateStrip(aspect) {
  const hfov = 2 * Math.atan(Math.tan(view.fov / 2) * aspect);
  let a = ((view.yaw + COV / 2) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  const vp = $('vp');
  vp.style.width = Math.min(100, hfov / COV * 100) + '%';
  vp.style.left = ((a - hfov / 2) / COV * 100) + '%';
  $('gap').style.opacity = a > COV + 0.05 ? 1 : 0;   // 正對未拍攝的缺口時提示
}

// ───────── 操作 ─────────
const touch = () => { lastInteract = performance.now(); dirty = true; };
const pointers = new Map();
let pinch0 = 0, fov0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); canvas.classList.add('drag'); touch();
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); fov0 = view.fov; } });
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, e); touch();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch0) view.fov = fov0 * pinch0 / d; return;
  }
  const k = view.fov / canvas.clientHeight;
  view.yaw -= (e.clientX - prev.clientX) * k;
  view.pitch += (e.clientY - prev.clientY) * k;
});
const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0; if (!pointers.size) canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); view.fov *= Math.exp(e.deltaY * 0.001); touch(); }, { passive: false });
window.addEventListener('keydown', e => {
  const s = 0.08;
  if (e.key === 'ArrowLeft') view.yaw -= s; else if (e.key === 'ArrowRight') view.yaw += s;  // 拖曳方向與鍵盤一致
  else if (e.key === 'ArrowUp') view.pitch += s; else if (e.key === 'ArrowDown') view.pitch -= s;
  else if (e.key === '+' || e.key === '=') view.fov *= 0.9; else if (e.key === '-') view.fov *= 1.1;
  else return;
  touch();
});

$('strip').addEventListener('click', e => {
  const r = $('strip').getBoundingClientRect();
  view.yaw = ((e.clientX - r.left) / r.width - 0.5) * COV; view.pitch = 0; touch();
});
$('btnAuto').setAttribute('aria-pressed', auto);
$('btnAuto').onclick = () => { auto = !auto; $('btnAuto').setAttribute('aria-pressed', auto); dirty = true; };
$('btnReset').onclick = () => { view.yaw = 0; view.pitch = 0; view.fov = FOV_DEFAULT; touch(); };
$('btnFlat').onclick = () => { const on = $('flat').hidden; $('flat').hidden = !on; $('btnFlat').setAttribute('aria-pressed', on); };
$('btnFull').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
</script>
</body>
</html>
